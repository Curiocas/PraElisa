<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1000 Elogios 💖</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #333;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #fff;
    }
    .elogio {
      background: #fff;
      margin: 10px auto;
      padding: 12px;
      border-radius: 10px;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<h1>1000 Elogios pra Você 💖</h1>

<div id="lista"></div>

<script>
const texto = `
Você é linda
Seu sorriso é encantador
Você tem um olhar marcante
Você é muito inteligente
Sua voz é agradável
Você tem um estilo incrível
Você é muito carismática
Sua presença é leve
Você transmite paz
Você é muito especial
Você tem um coração enorme
Você é divertida
Você é muito educada
Você tem uma energia boa
Você é inspiradora
Você é determinada
Você é única
Você é cheia de atitude
Você é muito elegante
Você é gentil
Você é criativa
Você é muito simpática
Você é encantadora
Você é autêntica
Você é muito dedicada
Você é incrível
Você é muito forte
Você é sensível na medida certa
Você é admirável
Você é cheia de talento
Você é inteligente demais
Você é muito organizada
Você é positiva
Você é iluminada
Você é muito estilosa
Você é confiante
Você é cheia de personalidade
Você é muito esforçada
Você é linda por dentro e por fora
Você é encantadora de um jeito único
Você é cheia de vida
Você é muito doce
Você é sincera
Você é cativante
Você é determinada demais
Você é maravilhosa
Você é muito especial pra quem te conhece
Você é divertida demais
Você é inteligente e bonita
Você é simplesmente perfeita
`;

const elogios = texto.split("\n");

const lista = document.getElementById("lista");

elogios.forEach(elogio => {
  if (elogio.trim() !== "") {
    const div = document.createElement("div");
    div.className = "elogio";
    div.innerText = elogio;
    lista.appendChild(div);
  }
});
</script>

</body>
</html>
